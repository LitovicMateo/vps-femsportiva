services:
  wordpress:
    # Pinned to the 6.x major (PHP 8.3, Apache) so a pull can't silently jump to
    # a new major; still receives 6.x minor/patch updates.
    image: wordpress:6-php8.3-apache
    restart: always
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # do not publish WordPress HTTP port directly; nginx will proxy requests
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_URL: ${WORDPRESS_URL}
      WORDPRESS_INTERNAL_URL: ${WORDPRESS_INTERNAL_URL:-http://wordpress}
      # WORDPRESS_CONFIG_EXTRA is defined per-environment overlay (not here)
      # because Docker Compose replaces (not merges) env vars from overlays.
    volumes:
      - ./data/ai1wm-unlimited.php:/var/www/html/wp-content/mu-plugins/ai1wm-unlimited.php:ro
      - ./data/view-counter.php:/var/www/html/wp-content/mu-plugins/view-counter.php:ro
      - ./data/revalidate-webhook.php:/var/www/html/wp-content/mu-plugins/revalidate-webhook.php:ro
      - ./data/sync-urls.php:/var/www/html/wp-content/mu-plugins/sync-urls.php:ro
      - wordpress_data:/var/www/html

  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    # Do NOT publish the Next.js port to the host in shared/prod environments;
    # nginx proxies it. The dev overlay re-adds a "3000:3000" host mapping for
    # local development only.
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_WORDPRESS_API_URL: ${NEXT_PUBLIC_WORDPRESS_API_URL}
      NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL}
      NODE_ENV: ${NODE_ENV}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      wordpress:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: always
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers_common.conf:/etc/nginx/conf.d/proxy_headers_common.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      wordpress:
        condition: service_healthy

volumes:
  db_data:
  wordpress_data:
