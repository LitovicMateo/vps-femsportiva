# Production Nginx Configuration with SSL
# This configuration handles HTTPS with Let's Encrypt certificates.
#
# NOTE: the domain (femsportiva.com / www.femsportiva.com) is hard-coded below.
# The stock nginx image does NOT run envsubst on files in conf.d/, so ${VARS}
# placed here are served literally (breaking cert loading). If the domain
# changes, update this file AND the DOMAIN value in .env.prod (used by
# scripts/init-ssl.sh for certificate issuance).

# Rate limiting zone (this file is included inside http{})
limit_req_zone $binary_remote_addr zone=wpjson:10m rate=30r/s;

# Keep WordPress internals (admin, REST API, theme files) out of search indexes
# while leaving uploaded media crawlable for image search. First match wins; an
# empty value makes add_header skip the header entirely. Applied via a single
# server-level add_header, so it is not lost to nginx's add_header inheritance
# rules in the /wp/ and /wp-json/ locations.
map $uri $robots_tag {
    ~^/wp/wp-content/uploads/ "";
    ~^/wp(/|-json/|$)         "noindex, nofollow";
    default                   "";
}

# Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name femsportiva.com www.femsportiva.com;
    
    # Allow Certbot challenge for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name femsportiva.com www.femsportiva.com;
    
    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;
    
    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/femsportiva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/femsportiva.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/femsportiva.com/chain.pem;

    # Security headers. NOTE: nginx drops ALL inherited add_header directives in
    # any location that declares its own add_header — so this set is repeated in
    # the /_next/static/ block below (which adds Cache-Control). Keep the two in
    # sync. CSP: no blanket `https:` on default/script-src (that let scripts load
    # from any origin); 'unsafe-inline' is retained because Next.js emits inline
    # bootstrap scripts and has no nonce pipeline here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.g.doubleclick.net https://partner.googleadservices.com https://fundingchoicesmessages.google.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://pagead2.googlesyndication.com https://*.g.doubleclick.net https://fundingchoicesmessages.google.com https://*.google.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://www.google.com https://fundingchoicesmessages.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    # Default request body limit; the /wp/ admin location raises it for migrations.
    client_max_body_size 64M;

    # Canonical host: redirect apex -> www (the app treats www as canonical)
    if ($host = femsportiva.com) {
        return 301 https://www.femsportiva.com$request_uri;
    }

    # Redirect WordPress paths to /wp/ prefix (convenience redirects)
    location = /wp-admin { return 301 /wp/wp-admin/; }
    location ~ ^/wp-(admin|login|signup|activate|content|includes)(/|\.php) {
        return 301 /wp$request_uri;
    }

    # Next.js static files (hashed filenames — cache forever)
    location /_next/static/ {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # This location declares its own add_header (Cache-Control), which makes
        # nginx drop the server-level security headers — so re-declare them here.
        # Keep in sync with the server block above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.g.doubleclick.net https://partner.googleadservices.com https://fundingchoicesmessages.google.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://pagead2.googlesyndication.com https://*.g.doubleclick.net https://fundingchoicesmessages.google.com https://*.google.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://www.google.com https://fundingchoicesmessages.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WordPress REST API (must be before / to match first)
    location /wp-json/ {
        limit_req zone=wpjson burst=20 nodelay;
        set $upstream_wordpress wordpress;
        proxy_pass http://$upstream_wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts for API requests
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
    
    # WordPress admin and backend
    location /wp/ {
        # Allow large uploads here for WP migrations (AI1WM via admin-ajax)
        client_max_body_size 1200M;
        set $upstream_wordpress wordpress;
        # Strip the /wp prefix. With a variable in proxy_pass, a URI there replaces
        # the whole request path, so the rewrite does the stripping instead.
        rewrite ^/wp/(.*) /$1 break;
        proxy_pass http://$upstream_wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Increase timeouts for WordPress admin
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
    
    # Next.js frontend (catch-all, must be last)
    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
