server {
  listen 80;
  server_name _;
  
  # Allow large file uploads (for WordPress migration)
  client_max_body_size 1200M;
  
  # Docker DNS resolver
  resolver 127.0.0.11 valid=30s;

  # WordPress REST API (must be before / to match first)
  location /wp-json/ {
    set $upstream_wordpress wordpress;
    proxy_pass http://$upstream_wordpress/wp-json/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # WordPress admin and backend
  location /wp/ {
    set $upstream_wordpress wordpress;
    proxy_pass http://$upstream_wordpress/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Next.js frontend (catch-all, must be last)
  location / {
    set $upstream_frontend frontend:3000;
    proxy_pass http://$upstream_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
