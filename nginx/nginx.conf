# Rate limiting zone (this file is included inside http{})
limit_req_zone $binary_remote_addr zone=wpjson:10m rate=30r/s;

# Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

server {
  listen 80;
  server_name _;

  # Dev/staging must never be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Default request body limit; the /wp/ admin location raises it for migrations.
  client_max_body_size 64M;

  # Docker DNS resolver
  resolver 127.0.0.11 valid=30s;

  # Set the port for redirects
  port_in_redirect on;
  absolute_redirect off;

  # Redirect WordPress paths to /wp/ prefix (must be before other WordPress locations)
  location = /wp-admin { return 301 /wp/wp-admin/; }
  location ~ ^/wp-(admin|login|signup|activate|content|includes)(/|\.php) {
    return 301 /wp$request_uri;
  }

  # Next.js static files (must be before / to match first)
  location /_next/static/ {
    set $upstream_frontend frontend:3000;
    proxy_pass http://$upstream_frontend;
    include /etc/nginx/conf.d/proxy_headers_common.conf;
    proxy_cache_valid 200 60m;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  # WordPress REST API (must be before /wp/ to match first)
  location /wp-json/ {
    limit_req zone=wpjson burst=20 nodelay;
    set $upstream_wordpress wordpress;
    proxy_pass http://$upstream_wordpress;
    include /etc/nginx/conf.d/proxy_headers_common.conf;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # WordPress admin and backend (everything under /wp/)
  location /wp/ {
    # Allow large uploads here for WP migrations (AI1WM via admin-ajax)
    client_max_body_size 1200M;
    set $upstream_wordpress wordpress;
    # Remove /wp prefix and pass the rest to WordPress
    rewrite ^/wp/(.*) /$1 break;
    proxy_pass http://$upstream_wordpress;
    include /etc/nginx/conf.d/proxy_headers_common.conf;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # Next.js frontend (catch-all, must be last)
  location / {
    set $upstream_frontend frontend:3000;
    proxy_pass http://$upstream_frontend;
    include /etc/nginx/conf.d/proxy_headers_common.conf;
  }
}
