services:
  wordpress:
    restart: unless-stopped
    environment:
      WORDPRESS_DEBUG: "0"
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      NEXT_REVALIDATE_SECRET: ${REVALIDATION_SECRET}
      VIEWS_SECRET: ${VIEWS_SECRET}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_HOME', '${WORDPRESS_URL}');
        define('WP_SITEURL', '${WORDPRESS_URL}');
        define('WP_CONTENT_URL', '${WORDPRESS_URL}/wp-content');

        @ini_set('upload_max_filesize', '1200M');
        @ini_set('post_max_size', '1200M');
        @ini_set('memory_limit', '512M');
        @ini_set('max_execution_time', '600');
        @ini_set('max_input_time', '600');

        /* SSL offloading - trust proxy headers */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }

        /* Disable file editing in production */
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);

        /* Authentication Unique Keys and Salts */
        define('AUTH_KEY',         '${WORDPRESS_AUTH_KEY}');
        define('SECURE_AUTH_KEY',  '${WORDPRESS_SECURE_AUTH_KEY}');
        define('LOGGED_IN_KEY',    '${WORDPRESS_LOGGED_IN_KEY}');
        define('NONCE_KEY',        '${WORDPRESS_NONCE_KEY}');
        define('AUTH_SALT',        '${WORDPRESS_AUTH_SALT}');
        define('SECURE_AUTH_SALT', '${WORDPRESS_SECURE_AUTH_SALT}');
        define('LOGGED_IN_SALT',   '${WORDPRESS_LOGGED_IN_SALT}');
        define('NONCE_SALT',       '${WORDPRESS_NONCE_SALT}');
    volumes:
      - /var/www/vps-blog/uploads:/var/www/html/wp-content/uploads
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - wordpress_data:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  database:
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_WORDPRESS_API_URL: ${NEXT_PUBLIC_WORDPRESS_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WORDPRESS_API_URL: ${NEXT_PUBLIC_WORDPRESS_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      VIEWS_SECRET: ${VIEWS_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # depends_on (condition: service_healthy) is defined in the base compose file.

  certbot:
    image: certbot/certbot:v3.1.0
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; sleep 30; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
